<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mascotas App - Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF2ED;
    --card: #FFFFFF;
    --ink: #1F2A24;
    --ink-muted: #5B6B60;
    --accent: #2F6F62;
    --accent-soft: #E7F0EC;
    --border: #E1E7E1;
    --warn-bg: #FBF3E4;
    --warn-ink: #8A5A11;
    --danger: #C24B4B;
    --danger-bg: #FBEAEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 22px; height: 22px; color: var(--accent); }
  .brand span { font-family: 'Fraunces', serif; font-weight: 500; font-size: 17px; }
  .usuario-actual { display: flex; align-items: center; gap: 10px; }
  .usuario-actual span { font-size: 13px; color: var(--ink-muted); }
  button.logout {
    font-family: inherit; font-size: 13px; color: var(--ink-muted);
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; cursor: pointer;
  }
  button.logout:hover { background: #F4F6F3; }

  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }

  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; margin: 0 0 4px; }
  .subt { color: var(--ink-muted); font-size: 14px; margin: 0 0 28px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab {
    font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink-muted);
    background: none; border: none; padding: 10px 4px; margin-right: 22px; cursor: pointer;
    border-bottom: 2px solid transparent; position: relative; top: 1px;
  }
  .tab.activo { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .conteo {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-size: 11px; font-weight: 500; border-radius: 20px; padding: 1px 7px; margin-left: 6px;
  }

  .vista { display: none; }
  .vista.activa { display: block; }

  .fila {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-weight: 500; font-size: 14px; flex-shrink: 0;
  }
  .info { flex: 1; min-width: 0; }
  .info p.nombre { margin: 0; font-size: 14px; font-weight: 500; }
  .info p.email { margin: 0; font-size: 13px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px;
    white-space: nowrap;
  }
  .badge.admin { background: var(--accent-soft); color: var(--accent); }
  .badge.usuario { background: #F0F0EC; color: var(--ink-muted); }
  .acciones { display: flex; gap: 6px; flex-shrink: 0; }

  button.accion {
    font-family: inherit; font-size: 13px; font-weight: 500;
    border-radius: 8px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--border);
    background: transparent; color: var(--ink);
  }
  button.aprobar { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.aprobar:hover { background: var(--accent-soft, #234F45); opacity: .92; }
  button.rechazar:hover, button.bloquear:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-bg); }
  button.desbloquear:hover { background: var(--accent-soft); color: var(--accent); }

  select.rol-select {
    font-family: inherit; font-size: 13px; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; background: #fff; color: var(--ink); cursor: pointer;
  }

  .vacio {
    text-align: center; padding: 50px 20px; color: var(--ink-muted); font-size: 14px;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s ease;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  .carga { text-align: center; padding: 50px; color: var(--ink-muted); font-size: 14px; }

  /* ===== Feedback ===== */
  .feedback-filtros { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .feedback-check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-muted); cursor: pointer; }
  .feedback-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .feedback-card.no-leido { border-left: 3px solid var(--accent); }
  .feedback-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .feedback-card-header .info { flex: 1; min-width: 0; }
  .feedback-card-header .info p.nombre { margin: 0; font-size: 14px; font-weight: 500; }
  .feedback-card-header .info p.meta { margin: 0; font-size: 12px; color: var(--ink-muted); }
  .feedback-mensaje { font-size: 14px; line-height: 1.5; margin: 0 0 12px; white-space: pre-wrap; }
  .feedback-acciones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .feedback-nota {
    width: 100%; margin-top: 10px; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-family: inherit; font-size: 13px; resize: vertical; min-height: 44px; box-sizing: border-box;
  }
  .badge.silenciado { background: var(--warn-bg); color: var(--warn-ink); }

  /* ===== Responsive: mobile ===== */
  @media (max-width: 480px) {
    header { padding: 14px 16px; }
    .brand span { font-size: 15px; }
    #nombre-admin { display: none; }
    main { padding: 24px 16px 50px; }
    h1 { font-size: 21px; }
    .fila { flex-wrap: wrap; gap: 10px; }
    .info { flex-basis: 100%; }
    .acciones { flex-basis: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <ellipse cx="7" cy="8" rx="2" ry="2.6"/><ellipse cx="12.5" cy="5.7" rx="2" ry="2.6"/>
      <ellipse cx="17.7" cy="8" rx="2" ry="2.6"/><ellipse cx="19.6" cy="13" rx="2" ry="2.6"/>
      <path d="M12.5 12c-3 0-6.2 2.4-6.2 5.6 0 1.7 1.4 2.9 3.1 2.6 1.1-.2 2-.5 3.1-.5s2 .3 3.1.5c1.7.3 3.1-.9 3.1-2.6 0-3.2-3.2-5.6-6.2-5.6z"/>
    </svg>
    <span>Mascotas app · admin</span>
  </div>
  <div class="usuario-actual">
    <a href="app.html" class="logout" style="text-decoration:none;">Mis mascotas</a>
    <span id="nombre-admin"></span>
    <button class="logout" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</header>

<main>
  <h1>Panel de administrador</h1>
  <p class="subt">Aprueba, bloquea o gestiona el acceso de los usuarios.</p>

  <div class="tabs">
    <button class="tab activo" id="tab-pendientes" onclick="cambiarTab('pendientes')">
      Pendientes<span class="conteo" id="conteo-pendientes">0</span>
    </button>
    <button class="tab" id="tab-activos" onclick="cambiarTab('activos')">
      Usuarios<span class="conteo" id="conteo-activos">0</span>
    </button>
    <button class="tab" id="tab-limites" onclick="cambiarTab('limites')">
      Límites
    </button>
    <button class="tab" id="tab-feedback" onclick="cambiarTab('feedback')">
      Feedback<span class="conteo" id="conteo-feedback">0</span>
    </button>
  </div>

  <div class="vista activa" id="vista-pendientes">
    <div id="lista-pendientes" class="carga">Cargando...</div>
  </div>

  <div class="vista" id="vista-activos">
    <div id="lista-activos" class="carga">Cargando...</div>
  </div>

  <div class="vista" id="vista-limites">
    <div class="fila" style="align-items: flex-end; flex-wrap: wrap;">
      <div class="info">
        <p class="nombre">Límite por defecto</p>
        <p class="email">Aplica a todos los usuarios sin un límite propio.</p>
      </div>
      <input type="number" min="1" id="input-limite-default" class="rol-select" style="width: 70px;">
      <button class="accion aprobar" onclick="guardarLimiteDefault()">Guardar</button>
    </div>
    <div id="lista-limites" class="carga">Cargando...</div>
  </div>

  <div class="vista" id="vista-feedback">
    <div class="feedback-filtros">
      <select id="filtro-estado-feedback" class="rol-select" onchange="pintarFeedback()">
        <option value="todos">Todos los estados</option>
        <option value="pendiente">Pendiente</option>
        <option value="interesante">Interesante</option>
        <option value="mejora_planificada">Mejora planificada</option>
        <option value="resuelto">Resuelto</option>
        <option value="descartado">Descartado</option>
      </select>
      <label class="feedback-check">
        <input type="checkbox" id="filtro-silenciados-feedback" onchange="pintarFeedback()">
        Mostrar silenciados
      </label>
    </div>
    <div id="lista-feedback" class="carga">Cargando...</div>
  </div>
</main>


<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  // ===================== CONFIG =====================
  const API_URL = 'https://script.google.com/macros/s/AKfycbxCLdntDxCPLNKEUpij7aIG7OZK3UnAnsCV1FR0Uq-CbO3j1ms0zMEHJeQwBeteRfKu4g/exec';
  const GOOGLE_CLIENT_ID = '891168012188-rlv06omnpf60gus1j69v582emeq109pp.apps.googleusercontent.com'; // el mismo Client ID que usas en index.html
  // ====================================================

  let idToken = localStorage.getItem('idToken');
  const usuarioLocal = JSON.parse(localStorage.getItem('usuario') || 'null');

  if (!idToken) {
    window.location.href = 'index.html';
  } else {
    document.getElementById('nombre-admin').textContent = usuarioLocal ? usuarioLocal.nombre : '';
    iniciarRenovacionSesion();
    cargarPendientes();
    cargarActivos();
    cargarLimites();
    cargarFeedback();
  }

  // ===================== RENOVACIÓN SILENCIOSA DE SESIÓN =====================
  // El idToken de Google expira ~1 hora después de emitido. En vez de solo
  // revisar cada X minutos (lo que no cubre el caso de volver a abrir la app
  // horas o días después, con el token ya vencido), cada llamada al backend
  // revisa primero si el token está vencido y, si es así, intenta renovarlo
  // en silencio ANTES de mandar la petición.
  let gisInicializado = false;
  let resolverRenovacion = null;

  function expiracionToken(token) {
    try {
      const payloadToken = JSON.parse(atob(token.split('.')[1]));
      return payloadToken.exp * 1000; // exp viene en segundos, Date.now() en ms
    } catch (e) {
      return 0;
    }
  }
  function tokenVencidoOAPuntoDeVencer(token, margenMs) {
    return expiracionToken(token) - Date.now() < (margenMs || 0);
  }
  function onTokenRenovado(respuesta) {
    idToken = respuesta.credential;
    localStorage.setItem('idToken', idToken);
    if (resolverRenovacion) { const r = resolverRenovacion; resolverRenovacion = null; r(true); }
  }
  // Espera a que la librería de Google (carga con async/defer) esté lista.
  function esperarGIS(maxEsperaMs) {
    return new Promise(resolve => {
      const inicio = Date.now();
      (function verificar() {
        if (typeof google !== 'undefined' && google.accounts && google.accounts.id) return resolve(true);
        if (Date.now() - inicio > maxEsperaMs) return resolve(false);
        setTimeout(verificar, 100);
      })();
    });
  }
  function asegurarGISInicializado() {
    return esperarGIS(3000).then(listo => {
      if (listo && !gisInicializado) {
        google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onTokenRenovado, auto_select: true });
        gisInicializado = true;
      }
      return gisInicializado;
    });
  }
  // Intenta renovar el idToken en silencio. Resuelve true si lo logró,
  // false si no (usuario sin sesión de Google activa, o no respondió a tiempo).
  function intentarRenovarToken() {
    return asegurarGISInicializado().then(listo => {
      if (!listo) return false;
      return new Promise(resolve => {
        let resuelto = false;
        resolverRenovacion = () => { if (!resuelto) { resuelto = true; resolve(true); } };
        google.accounts.id.prompt(notificacion => {
          const fallo = (notificacion.isNotDisplayed && notificacion.isNotDisplayed()) ||
                        (notificacion.isSkippedMoment && notificacion.isSkippedMoment());
          if (fallo && !resuelto) { resuelto = true; resolverRenovacion = null; resolve(false); }
        });
        setTimeout(() => { if (!resuelto) { resuelto = true; resolverRenovacion = null; resolve(false); } }, 4000);
      });
    });
  }
  function iniciarRenovacionSesion() {
    asegurarGISInicializado();
    // Respaldo: si la pestaña se queda abierta varias horas seguidas, renueva
    // antes de que el token en uso llegue a vencer.
    setInterval(() => {
      if (tokenVencidoOAPuntoDeVencer(idToken, 10 * 60 * 1000)) intentarRenovarToken();
    }, 5 * 60 * 1000);
  }

  function iniciales(nombre) {
    if (!nombre) return '?';
    return nombre.trim().split(' ').slice(0, 2).map(p => p[0]).join('').toUpperCase();
  }

  function llamar(action, payload) {
    const hacerRequest = () => {
      let url = API_URL + '?action=' + action + '&idToken=' + encodeURIComponent(idToken);
      if (payload) url += '&payload=' + encodeURIComponent(JSON.stringify(payload));
      return fetch(url).then(r => r.json());
    };
    const previo = tokenVencidoOAPuntoDeVencer(idToken) ? intentarRenovarToken() : Promise.resolve(true);

    return previo.then(hacerRequest).then(data => {
      if (!data.ok && (data.estado || data.error === 'Token inválido')) {
        // sesión ya no es admin, fue bloqueada, o el token expiró y no se pudo renovar -> volver al login
        cerrarSesion();
      }
      return data;
    });
  }

  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 2200);
  }

  function cambiarTab(nombre) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('activo'));
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
    document.getElementById('tab-' + nombre).classList.add('activo');
    document.getElementById('vista-' + nombre).classList.add('activa');
  }

  function cargarPendientes() {
    llamar('getUsuariosPendientes').then(data => {
      if (!Array.isArray(data)) {
        document.getElementById('lista-pendientes').innerHTML =
          '<div class="vacio">No se pudo cargar: ' + (data && data.error ? data.error : 'error desconocido') + '</div>';
        return;
      }
      document.getElementById('conteo-pendientes').textContent = data.length;
      const cont = document.getElementById('lista-pendientes');
      if (data.length === 0) {
        cont.innerHTML = '<div class="vacio">No hay solicitudes pendientes.</div>';
        return;
      }
      cont.innerHTML = '';
      data.forEach(u => {
        const fila = document.createElement('div');
        fila.className = 'fila';
        fila.innerHTML =
          '<div class="avatar">' + iniciales(u.nombre) + '</div>' +
          '<div class="info"><p class="nombre">' + (u.nombre || 'Sin nombre') + '</p><p class="email">' + u.email + '</p></div>' +
          '<div class="acciones">' +
            '<button class="accion aprobar" data-email="' + u.email + '">Aprobar</button>' +
            '<button class="accion rechazar" data-email="' + u.email + '">Rechazar</button>' +
          '</div>';
        fila.querySelector('.aprobar').onclick = () => aprobar(u.email);
        fila.querySelector('.rechazar').onclick = () => rechazar(u.email);
        cont.appendChild(fila);
      });
    });
  }

  function cargarActivos() {
    llamar('getUsuarios').then(data => {
      if (!Array.isArray(data)) {
        document.getElementById('lista-activos').innerHTML =
          '<div class="vacio">No se pudo cargar: ' + (data && data.error ? data.error : 'error desconocido') + '</div>';
        return;
      }
      const activos = data.filter(u => u.estado !== 'pendiente');
      document.getElementById('conteo-activos').textContent = activos.length;
      const cont = document.getElementById('lista-activos');
      if (activos.length === 0) {
        cont.innerHTML = '<div class="vacio">Todavía no hay usuarios gestionados.</div>';
        return;
      }
      cont.innerHTML = '';
      activos.forEach(u => {
        const esUnoMismo = usuarioLocal && u.email === usuarioLocal.email;
        const fila = document.createElement('div');
        fila.className = 'fila';
        fila.innerHTML =
          '<div class="avatar">' + iniciales(u.nombre) + '</div>' +
          '<div class="info"><p class="nombre">' + (u.nombre || 'Sin nombre') + '</p><p class="email">' + u.email + '</p></div>' +
          '<span class="badge ' + u.rol + '">' + (u.rol === 'admin' ? 'Admin' : 'Usuario') + '</span>' +
          '<div class="acciones"></div>';

        const acciones = fila.querySelector('.acciones');

        if (!esUnoMismo) {
          const selectRol = document.createElement('select');
          selectRol.className = 'rol-select';
          selectRol.innerHTML = '<option value="usuario">Usuario</option><option value="admin">Admin</option>';
          selectRol.value = u.rol;
          selectRol.onchange = () => cambiarRol(u.email, selectRol.value);
          acciones.appendChild(selectRol);
        }

        const btnEstado = document.createElement('button');
        btnEstado.className = 'accion ' + (u.estado === 'bloqueado' ? 'desbloquear' : 'bloquear');
        btnEstado.textContent = u.estado === 'bloqueado' ? 'Desbloquear' : 'Bloquear';
        if (esUnoMismo) { btnEstado.disabled = true; btnEstado.style.opacity = '0.4'; }
        else btnEstado.onclick = () => toggleBloqueo(u.email, u.estado);
        acciones.appendChild(btnEstado);

        cont.appendChild(fila);
      });
    });
  }

  function aprobar(email) {
    llamar('aprobarUsuario', { email }).then(data => {
      if (data.ok) { mostrarToast('Usuario aprobado'); cargarPendientes(); cargarActivos(); }
      else mostrarToast(data.error || 'No se pudo aprobar');
    });
  }
  function rechazar(email) {
    if (!confirm('¿Rechazar el acceso de ' + email + '?')) return;
    llamar('bloquearUsuario', { email }).then(data => {
      if (data.ok) { mostrarToast('Solicitud rechazada'); cargarPendientes(); cargarActivos(); }
      else mostrarToast(data.error || 'No se pudo rechazar');
    });
  }
  function toggleBloqueo(email, estadoActual) {
    const accion = estadoActual === 'bloqueado' ? 'aprobarUsuario' : 'bloquearUsuario';
    llamar(accion, { email }).then(data => {
      if (data.ok) { mostrarToast(estadoActual === 'bloqueado' ? 'Usuario desbloqueado' : 'Usuario bloqueado'); cargarActivos(); }
      else mostrarToast(data.error || 'No se pudo actualizar');
    });
  }
  function cambiarRol(email, nuevoRol) {
    llamar('cambiarRol', { email, rol: nuevoRol }).then(data => {
      if (data.ok) mostrarToast('Rol actualizado');
      else { mostrarToast(data.error || 'No se pudo cambiar el rol'); cargarActivos(); }
    });
  }

  // ===================== LÍMITES DE MASCOTAS (MEJORA-010) =====================
  function cargarLimites() {
    llamar('getConfiguracionLimites').then(data => {
      if (!data.ok) {
        document.getElementById('lista-limites').innerHTML =
          '<div class="vacio">No se pudo cargar: ' + (data.error || 'error desconocido') + '</div>';
        return;
      }
      document.getElementById('input-limite-default').value = data.limite_default;

      const cont = document.getElementById('lista-limites');
      if (data.usuarios.length === 0) {
        cont.innerHTML = '<div class="vacio">No hay usuarios todavía.</div>';
        return;
      }
      cont.innerHTML = '';
      data.usuarios.forEach(u => {
        const fila = document.createElement('div');
        fila.className = 'fila';
        fila.innerHTML =
          '<div class="avatar">' + iniciales(u.nombre) + '</div>' +
          '<div class="info"><p class="nombre">' + (u.nombre || 'Sin nombre') + '</p>' +
          '<p class="email">' + u.mascotas_actuales + ' de ' + u.limite_efectivo + ' mascotas' +
          (u.override === null ? ' (usa el límite por defecto)' : ' (límite propio)') + '</p></div>' +
          '<div class="acciones">' +
            '<input type="number" min="1" class="rol-select" style="width: 60px;" placeholder="def." value="' + (u.override === null ? '' : u.override) + '">' +
            '<button class="accion aprobar">Guardar</button>' +
          '</div>';
        const input = fila.querySelector('input');
        fila.querySelector('.aprobar').onclick = () => guardarLimiteUsuario(u.id_usuario, input.value);
        cont.appendChild(fila);
      });
    });
  }

  function guardarLimiteDefault() {
    const nuevoValor = Number(document.getElementById('input-limite-default').value);
    llamar('actualizarLimiteDefault', { nuevo_valor: nuevoValor }).then(data => {
      if (data.ok) { mostrarToast('Límite por defecto actualizado'); cargarLimites(); }
      else {
        mostrarToast(data.error || 'No se pudo actualizar');
        if (data.usuarios_afectados) {
          alert('Usuarios que quedarían sobre el límite:\n' +
            data.usuarios_afectados.map(u => '- ' + u.nombre + ' (' + u.mascotas_actuales + ' mascotas)').join('\n'));
        }
        cargarLimites();
      }
    });
  }

  function guardarLimiteUsuario(idUsuario, valorInput) {
    const nuevoValor = valorInput === '' ? null : Number(valorInput);
    llamar('actualizarLimiteUsuario', { id_usuario: idUsuario, nuevo_valor: nuevoValor }).then(data => {
      if (data.ok) { mostrarToast('Límite actualizado'); cargarLimites(); }
      else { mostrarToast(data.error || 'No se pudo actualizar'); cargarLimites(); }
    });
  }

  // ===================== FEEDBACK =====================
  const ETIQUETAS_ESTADO_FEEDBACK = {
    pendiente: 'Pendiente',
    interesante: 'Interesante',
    mejora_planificada: 'Mejora planificada',
    resuelto: 'Resuelto',
    descartado: 'Descartado'
  };
  let feedbackData = [];

  function cargarFeedback() {
    llamar('getFeedback').then(data => {
      if (!data.ok) {
        document.getElementById('lista-feedback').innerHTML =
          '<div class="vacio">No se pudo cargar: ' + (data.error || 'error desconocido') + '</div>';
        return;
      }
      feedbackData = data.feedback;
      document.getElementById('conteo-feedback').textContent = feedbackData.filter(f => !f.leido).length;
      pintarFeedback();
    });
  }

  function pintarFeedback() {
    const filtroEstado = document.getElementById('filtro-estado-feedback').value;
    const mostrarSilenciados = document.getElementById('filtro-silenciados-feedback').checked;

    let items = feedbackData;
    if (filtroEstado !== 'todos') items = items.filter(f => f.estado === filtroEstado);
    if (!mostrarSilenciados) items = items.filter(f => !f.usuario_silenciado);

    const cont = document.getElementById('lista-feedback');
    if (items.length === 0) {
      cont.innerHTML = '<div class="vacio">No hay feedback que coincida con este filtro.</div>';
      return;
    }
    cont.innerHTML = '';
    items.forEach(f => {
      const card = document.createElement('div');
      card.className = 'feedback-card' + (f.leido ? '' : ' no-leido');

      const fecha = f.fecha_registro ? new Date(f.fecha_registro).toLocaleDateString() : '';
      const opcionesEstado = Object.keys(ETIQUETAS_ESTADO_FEEDBACK)
        .map(k => '<option value="' + k + '"' + (k === f.estado ? ' selected' : '') + '>' + ETIQUETAS_ESTADO_FEEDBACK[k] + '</option>')
        .join('');

      card.innerHTML =
        '<div class="feedback-card-header">' +
          '<div class="avatar">' + iniciales(f.nombre_usuario) + '</div>' +
          '<div class="info">' +
            '<p class="nombre">' + (f.nombre_usuario || 'Sin nombre') + '</p>' +
            '<p class="meta">' + f.email_usuario + ' · ' + (f.pagina || 'página desconocida') + ' · ' + fecha + '</p>' +
          '</div>' +
          (f.usuario_silenciado ? '<span class="badge silenciado">Silenciado</span>' : '') +
        '</div>' +
        '<p class="feedback-mensaje">' + f.mensaje + '</p>' +
        '<div class="feedback-acciones">' +
          '<select class="rol-select select-estado"></select>' +
          '<button class="accion btn-leido">' + (f.leido ? 'Marcar no leído' : 'Marcar leído') + '</button>' +
          '<button class="accion btn-silenciar">' + (f.usuario_silenciado ? 'Dejar de silenciar' : 'Silenciar este usuario') + '</button>' +
        '</div>' +
        '<textarea class="feedback-nota" placeholder="Nota interna (ej. referencia a una mejora del backlog)...">' + (f.nota_admin || '') + '</textarea>';

      const selectEstado = card.querySelector('.select-estado');
      selectEstado.innerHTML = opcionesEstado;
      selectEstado.onchange = () => actualizarFeedback(f.id_feedback, { estado: selectEstado.value, leido: true });

      card.querySelector('.btn-leido').onclick = () => actualizarFeedback(f.id_feedback, { leido: !f.leido });
      card.querySelector('.btn-silenciar').onclick = () => silenciarUsuarioFeedback(f.id_usuario, !f.usuario_silenciado);

      const textareaNota = card.querySelector('.feedback-nota');
      textareaNota.onblur = () => {
        if (textareaNota.value !== (f.nota_admin || '')) {
          actualizarFeedback(f.id_feedback, { nota_admin: textareaNota.value }, true);
        }
      };

      cont.appendChild(card);
    });
  }

  // silencioso = true evita repintar toda la lista (para no perder el foco al escribir la nota)
  function actualizarFeedback(idFeedback, cambios, silencioso) {
    llamar('actualizarFeedback', Object.assign({ id_feedback: idFeedback }, cambios)).then(data => {
      if (data.ok) {
        const item = feedbackData.find(f => f.id_feedback === idFeedback);
        if (item) Object.assign(item, cambios);
        document.getElementById('conteo-feedback').textContent = feedbackData.filter(f => !f.leido).length;
        if (!silencioso) pintarFeedback();
        else mostrarToast('Nota guardada');
      } else {
        mostrarToast(data.error || 'No se pudo actualizar');
      }
    });
  }

  function silenciarUsuarioFeedback(idUsuario, silenciado) {
    llamar('silenciarUsuarioFeedback', { id_usuario: idUsuario, silenciado: silenciado }).then(data => {
      if (data.ok) {
        feedbackData.filter(f => f.id_usuario === idUsuario).forEach(f => f.usuario_silenciado = silenciado);
        mostrarToast(silenciado ? 'Usuario silenciado' : 'Usuario ya no está silenciado');
        pintarFeedback();
      } else {
        mostrarToast(data.error || 'No se pudo actualizar');
      }
    });
  }

  function cerrarSesion() {
    localStorage.removeItem('idToken');
    localStorage.removeItem('usuario');
    window.location.href = 'index.html';
  }
</script>

</body>
