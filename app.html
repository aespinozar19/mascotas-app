<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mascotas App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF2ED;
    --card: #FFFFFF;
    --ink: #1F2A24;
    --ink-muted: #5B6B60;
    --accent: #2F6F62;
    --accent-dark: #234F45;
    --accent-soft: #E7F0EC;
    --border: #E1E7E1;
    --warn-bg: #FBF3E4;
    --warn-ink: #8A5A11;
    --danger: #C24B4B;
    --danger-bg: #FBEAEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif; color: var(--ink);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px; background: var(--card); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 22px; height: 22px; color: var(--accent); }
  .brand span { font-family: 'Fraunces', serif; font-weight: 500; font-size: 17px; }
  .usuario-actual { display: flex; align-items: center; gap: 10px; }
  .usuario-actual span { font-size: 13px; color: var(--ink-muted); }
  button.logout {
    font-family: inherit; font-size: 13px; color: var(--ink-muted);
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; cursor: pointer;
  }
  button.logout:hover { background: #F4F6F3; }

  main { max-width: 720px; margin: 0 auto; padding: 36px 20px 60px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; margin: 0 0 4px; }
  .subt { color: var(--ink-muted); font-size: 14px; margin: 0 0 28px; }

  .alertas-banner {
    display: none; align-items: center; gap: 10px;
    background: var(--warn-bg); color: var(--warn-ink);
    border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 22px;
  }
  .alertas-banner.visible { display: flex; }
  .alertas-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

  .grid-mascotas {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px;
  }

  .card-mascota {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; cursor: pointer; transition: border-color .15s ease;
    position: relative;
  }
  .card-mascota:hover { border-color: var(--accent); }

  .icono-mascota {
    width: 46px; height: 46px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .icono-mascota svg { width: 22px; height: 22px; }

  .card-mascota p.nombre { margin: 0 0 2px; font-family: 'Fraunces', serif; font-size: 17px; font-weight: 500; }
  .card-mascota p.detalle { margin: 0; font-size: 13px; color: var(--ink-muted); }

  .punto-alerta {
    position: absolute; top: 18px; right: 18px;
    width: 9px; height: 9px; border-radius: 50%; background: var(--warn-ink);
  }

  .card-agregar {
    background: transparent; border: 1.5px dashed var(--border); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 20px; cursor: pointer; color: var(--ink-muted); min-height: 130px;
    font-family: inherit; font-size: 13px;
  }
  .card-agregar:hover { border-color: var(--accent); color: var(--accent); }
  .card-agregar svg { width: 22px; height: 22px; }

  .limite-nota { font-size: 12px; color: var(--ink-muted); margin-top: 18px; text-align: center; }

  .vacio { text-align: center; padding: 50px 20px; color: var(--ink-muted); font-size: 14px; grid-column: 1 / -1; }
  .carga { text-align: center; padding: 50px; color: var(--ink-muted); font-size: 14px; grid-column: 1 / -1; }

  /* Modal */
  .modal-fondo {
    display: none; position: fixed; inset: 0; min-height: 100vh; min-height: 100dvh;
    background: rgba(20,30,25,0.45); align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto; z-index: 50;
  }
  .modal-fondo.visible { display: flex; }
  .modal-box {
    background: var(--card); border-radius: 18px; padding: 28px; width: 100%; max-width: 380px;
  }
  .modal-box h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 19px; margin: 0 0 18px; }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 13px; color: var(--ink-muted); margin-bottom: 5px; }
  .campo input, .campo select {
    width: 100%; font-family: inherit; font-size: 14px; padding: 9px 11px;
    border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--ink);
  }
  .fila-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .error-campo { font-size: 12px; color: var(--danger); margin-top: 4px; display: none; }

  .modal-acciones { display: flex; gap: 8px; margin-top: 20px; }
  button.primario, button.secundario {
    flex: 1; font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 10px; border-radius: 9px; cursor: pointer;
  }
  button.primario { background: var(--accent); border: 1px solid var(--accent); color: #fff; }
  button.primario:hover { background: var(--accent-dark); }
  button.secundario { background: transparent; border: 1px solid var(--border); color: var(--ink); }
  button.secundario:hover { background: #F4F6F3; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== Responsive: mobile ===== */
  @media (max-width: 480px) {
    header { padding: 14px 16px; }
    .brand span { font-size: 15px; }
    .usuario-actual span { display: none; }
    main { padding: 24px 16px 50px; }
    h1 { font-size: 21px; }
    .grid-mascotas { grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-box { padding: 22px 18px; }
    .fila-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 340px) {
    .grid-mascotas { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <ellipse cx="7" cy="8" rx="2" ry="2.6"/><ellipse cx="12.5" cy="5.7" rx="2" ry="2.6"/>
      <ellipse cx="17.7" cy="8" rx="2" ry="2.6"/><ellipse cx="19.6" cy="13" rx="2" ry="2.6"/>
      <path d="M12.5 12c-3 0-6.2 2.4-6.2 5.6 0 1.7 1.4 2.9 3.1 2.6 1.1-.2 2-.5 3.1-.5s2 .3 3.1.5c1.7.3 3.1-.9 3.1-2.6 0-3.2-3.2-5.6-6.2-5.6z"/>
    </svg>
    <span>Mascotas app</span>
  </div>
  <div class="usuario-actual">
    <span id="nombre-usuario"></span>
    <button class="logout" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</header>

<main>
  <h1>Tus mascotas</h1>
  <p class="subt">Selecciona una para ver su historial, o agrega una nueva.</p>

  <div class="alertas-banner" id="alertas-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span id="alertas-texto"></span>
  </div>

  <div class="grid-mascotas" id="grid-mascotas">
    <div class="carga">Cargando tus mascotas...</div>
  </div>

  <p class="limite-nota" id="nota-limite" style="display:none;">Ya registraste el máximo de 3 mascotas.</p>
</main>

<div class="modal-fondo" id="modal-fondo">
  <div class="modal-box">
    <h2>Agregar mascota</h2>
    <div class="campo">
      <label>Nombre</label>
      <input type="text" id="m-nombre" placeholder="Firulais">
      <p class="error-campo" id="err-nombre">Ingresa un nombre</p>
    </div>
    <div class="fila-2">
      <div class="campo">
        <label>Tipo</label>
        <select id="m-tipo"></select>
      </div>
      <div class="campo">
        <label>Sexo</label>
        <select id="m-sexo"></select>
      </div>
    </div>
    <div class="fila-2">
      <div class="campo">
        <label>Raza (opcional)</label>
        <input type="text" id="m-raza" placeholder="Mestizo">
      </div>
      <div class="campo">
        <label>Peso actual (kg)</label>
        <input type="number" step="0.1" id="m-peso" placeholder="8.5">
      </div>
    </div>
    <div class="campo">
      <label>Fecha de nacimiento (opcional)</label>
      <input type="date" id="m-fecha-nac">
    </div>
    <div class="modal-acciones">
      <button class="secundario" onclick="cerrarModal()">Cancelar</button>
      <button class="primario" id="btn-guardar" onclick="guardarMascota()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ===================== CONFIG =====================
  const API_URL = 'https://script.google.com/macros/s/AKfycbxCLdntDxCPLNKEUpij7aIG7OZK3UnAnsCV1FR0Uq-CbO3j1ms0zMEHJeQwBeteRfKu4g/exec';
  // ====================================================

  const idToken = localStorage.getItem('idToken');
  const usuarioLocal = JSON.parse(localStorage.getItem('usuario') || 'null');
  let catalogoTipos = [];
  let catalogoSexos = [];

  if (!idToken) {
    window.location.href = 'index.html';
  } else {
    document.getElementById('nombre-usuario').textContent = usuarioLocal ? usuarioLocal.nombre : '';
    cargarCatalogo();
    cargarMascotas();
    cargarAlertas();
  }

  function llamar(action, payload, publico) {
    let url = API_URL + '?action=' + action;
    if (!publico) url += '&idToken=' + encodeURIComponent(idToken);
    if (payload) url += '&payload=' + encodeURIComponent(JSON.stringify(payload));
    return fetch(url).then(r => r.json()).then(data => {
      if (!data.ok && data.estado) cerrarSesion();
      return data;
    });
  }

  function iniciales(nombre) {
    if (!nombre) return '?';
    return nombre.trim().split(' ').slice(0, 2).map(p => p[0]).join('').toUpperCase();
  }

  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 2200);
  }

  function cargarCatalogo() {
    llamar('getParametrias', null, true).then(data => {
      if (!Array.isArray(data)) return;
      catalogoTipos = data.filter(p => p.categoria === 'TIPO_MASCOTA' && p.activo);
      catalogoSexos = data.filter(p => p.categoria === 'SEXO_MASCOTA' && p.activo);

      const selTipo = document.getElementById('m-tipo');
      selTipo.innerHTML = catalogoTipos.map(t => '<option value="' + t.id_parametro + '">' + t.nombre + '</option>').join('');

      const selSexo = document.getElementById('m-sexo');
      selSexo.innerHTML = catalogoSexos.map(s => '<option value="' + s.id_parametro + '">' + s.nombre + '</option>').join('');
    });
  }

  function nombreTipo(idParametro) {
    const t = catalogoTipos.find(t => t.id_parametro === idParametro);
    return t ? t.nombre : idParametro;
  }

  let idsConAlerta = [];

  function cargarAlertas() {
    llamar('getAlertas').then(data => {
      if (!Array.isArray(data)) return;
      idsConAlerta = data.map(e => e.id_mascota);
      const banner = document.getElementById('alertas-banner');
      if (data.length > 0) {
        document.getElementById('alertas-texto').textContent =
          data.length === 1 ? 'Tienes 1 evento por vencer esta semana.' : 'Tienes ' + data.length + ' eventos por vencer esta semana.';
        banner.classList.add('visible');
      }
      pintarPuntosAlerta();
    });
  }

  function pintarPuntosAlerta() {
    document.querySelectorAll('.card-mascota').forEach(card => {
      const id = card.dataset.id;
      const existente = card.querySelector('.punto-alerta');
      if (idsConAlerta.includes(id) && !existente) {
        const punto = document.createElement('div');
        punto.className = 'punto-alerta';
        card.appendChild(punto);
      }
    });
  }

  let totalMascotas = 0;

  function cargarMascotas() {
    llamar('getMascotas').then(data => {
      if (!Array.isArray(data)) return;
      totalMascotas = data.length;
      const grid = document.getElementById('grid-mascotas');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = '<div class="vacio">Aún no registraste ninguna mascota.</div>';
      } else {
        data.forEach(m => {
          const card = document.createElement('div');
          card.className = 'card-mascota';
          card.dataset.id = m.id_mascota;
          card.innerHTML =
            '<div class="icono-mascota"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="7" cy="8" rx="2" ry="2.6"/><ellipse cx="12.5" cy="5.7" rx="2" ry="2.6"/><ellipse cx="17.7" cy="8" rx="2" ry="2.6"/><ellipse cx="19.6" cy="13" rx="2" ry="2.6"/><path d="M12.5 12c-3 0-6.2 2.4-6.2 5.6 0 1.7 1.4 2.9 3.1 2.6 1.1-.2 2-.5 3.1-.5s2 .3 3.1.5c1.7.3 3.1-.9 3.1-2.6 0-3.2-3.2-5.6-6.2-5.6z"/></svg></div>' +
            '<p class="nombre">' + m.nombre + '</p>' +
            '<p class="detalle">' + nombreTipo(m.tipo) + (m.raza ? ' · ' + m.raza : '') + '</p>';
          card.onclick = () => window.location.href = 'mascota.html?id=' + m.id_mascota;
          grid.appendChild(card);
        });
      }

      if (data.length < 3) {
        const btnAgregar = document.createElement('button');
        btnAgregar.className = 'card-agregar';
        btnAgregar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Agregar mascota';
        btnAgregar.onclick = abrirModal;
        grid.appendChild(btnAgregar);
        document.getElementById('nota-limite').style.display = 'none';
      } else {
        document.getElementById('nota-limite').style.display = 'block';
      }

      pintarPuntosAlerta();
    });
  }

  function abrirModal() {
    document.getElementById('m-nombre').value = '';
    document.getElementById('m-raza').value = '';
    document.getElementById('m-peso').value = '';
    document.getElementById('m-fecha-nac').value = '';
    document.getElementById('err-nombre').style.display = 'none';
    document.getElementById('modal-fondo').classList.add('visible');
  }
  function cerrarModal() {
    document.getElementById('modal-fondo').classList.remove('visible');
  }

  function guardarMascota() {
    const nombre = document.getElementById('m-nombre').value.trim();
    if (!nombre) {
      document.getElementById('err-nombre').style.display = 'block';
      return;
    }
    document.getElementById('err-nombre').style.display = 'none';

    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    llamar('crearMascota', {
      nombre: nombre,
      tipo: document.getElementById('m-tipo').value,
      sexo: document.getElementById('m-sexo').value,
      raza: document.getElementById('m-raza').value.trim(),
      peso_actual: document.getElementById('m-peso').value,
      fecha_nacimiento: document.getElementById('m-fecha-nac').value
    }).then(data => {
      btn.disabled = false;
      btn.textContent = 'Guardar';
      if (data.ok) {
        cerrarModal();
        mostrarToast('Mascota agregada');
        cargarMascotas();
      } else {
        mostrarToast(data.error || 'No se pudo guardar');
      }
    });
  }

  function cerrarSesion() {
    localStorage.removeItem('idToken');
    localStorage.removeItem('usuario');
    window.location.href = 'index.html';
  }
</script>

</body>
</html>
